version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora-rivas-python
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Agora Rivas API"
      API_PREFIX: "/api"
      DEBUG: "true"
    volumes:
      - .:/app
    command: python -m agora_rivas.main
    restart: unless-stopped
